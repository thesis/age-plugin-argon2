[package]
name = "age-plugin-argon2-cli"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "age-plugin-argon2"
path = "src/main.rs"

[dependencies]
age-plugin-argon2 = { path = "../age-plugin-argon2" }
age = "0.11"
age-core = "0.11"
age-plugin = "0.6"
bech32 = "0.9"
clap = { version = "4", features = ["derive"] }
secrecy = "0.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3"
rexpect = "0.6"
