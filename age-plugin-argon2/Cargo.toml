[package]
name = "age-plugin-argon2"
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Argon2id recipient/identity plugin for the age encryption format"
repository = "https://github.com/thesis/age-plugin-argon2"
readme = "../README.md"
categories = ["cryptography", "authentication"]
keywords = ["age", "argon2", "encryption", "password", "plugin"]

[features]
default = ["plugin"]
# The `age-plugin-argon2` binary. A crate that only links the library
# can turn this off and skip the plugin protocol and CLI dependencies.
plugin = ["dep:age-plugin", "dep:bech32", "dep:clap"]
e2e = ["plugin"]

[[bin]]
name = "age-plugin-argon2"
required-features = ["plugin"]

[[test]]
name = "e2e"
required-features = ["e2e"]

[dependencies]
age-core = "0.11"
age = "0.11"
age-plugin = { version = "0.6", optional = true }
argon2 = { version = "0.5", features = ["std"] }
bech32 = { version = "0.9", optional = true }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"], optional = true }
rand = { version = "0.8", features = ["std_rng"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1.7", features = ["derive"] }
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
bech32 = "0.9"
serde_json = "1.0"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
rexpect = "0.6"
